spring.application.name=swing-journal
# Data lives in a plain file OUTSIDE the project, so rebuilds never touch it.
# Override with -Djournal.db.dir=/some/folder
spring.datasource.url=jdbc:sqlite:${journal.db.dir:${user.home}/swing-journal}/journal.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1
spring.servlet.multipart.max-file-size=5MB
